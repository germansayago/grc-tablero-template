<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- CAMBIÁ el título por el de tu tablero -->
  <title>Tablero — Gobierno de Río Cuarto</title>

  <!-- Aplica el tema guardado ANTES de pintar la página, para que no se vea
       primero claro y después oscuro (o al revés) por un instante. No se toca. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('tablero-tema');
        if (t === 'claro' || t === 'oscuro') { document.documentElement.setAttribute('data-tema', t); }
      } catch (e) {}
    })();
  </script>

  <!-- El design system compartido. No hace falta tocar estas líneas. -->
  <link rel="stylesheet" href="css/fuentes.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/iconos.css">

  <!-- Los estilos propios de ESTE tablero. Va último para poder ajustar
       lo de arriba. Es el archivo donde escribís tu CSS. -->
  <link rel="stylesheet" href="css/tablero.css">
</head>
<body>

  <!-- ================= HEADER (igual en todos los tableros) ================ -->
  <header class="encabezado">
    <div class="contenedor">
      <img class="logo" src="assets/img/logo-gobierno.webp" alt="Gobierno de Río Cuarto">
      <span class="separador" aria-hidden="true"></span>
      <div class="titulos">
        <h1>Equipo de Estadísticas</h1>
      </div>

      <!-- Interruptor de modo claro/oscuro. Igual en todos los tableros: no se toca. -->
      <button type="button" class="boton-tema" id="boton-tema" aria-label="Cambiar entre modo claro y oscuro">
        <svg class="icono-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>
        </svg>
        <svg class="icono-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ========================= CONTENIDO ================================== -->
  <main>
    <div class="contenedor">

      <!-- CAMBIÁ el título y la bajada por los de tu tablero -->
      <section class="intro">
        <h2>Título del tablero</h2>
        <p class="bajada">Una línea que explica qué muestra este tablero y para qué sirve.</p>
      </section>

      <!-- Empezá tu tablero acá. Usá las clases de css/componentes.css
           (.kpi, .panel, .boton, .titulo-*, .estado — ver guia-diseno.html)
           y escribí la lógica en js/tablero.js. Cómo cargués tus datos
           (fetch, un <script> con tus datos, lo que te convenga) es tu
           decisión — ver AGENTS.md. -->

    </div>
  </main>

  <!-- ================= FOOTER (igual en todos los tableros) ================ -->
  <footer class="pie">
    <div class="contenedor">
      <div class="pie-textos">
        <p>Equipo de Estadísticas · Gobierno de Río Cuarto</p>
        <p>Fuente: elaboración propia con datos agregados y publicables.</p>
      </div>
      <nav class="enlaces-paginas" aria-label="Páginas de la plantilla">
        <a href="guia-diseno.html">Sistema de diseño</a>
      </nav>
    </div>
  </footer>

  <!-- El interruptor de tema y TU lógica. -->
  <script src="js/tema.js"></script>
  <script src="js/tablero.js"></script>
</body>
</html>
