name: Revisar tablero

# Corre solo, en GitHub, cada vez que alguien sube algo o abre un Pull Request.
# Si algo falla, el cambio queda marcado en rojo y no debería publicarse hasta
# arreglarlo. El equipo no ejecuta nada a mano: esto es la red de seguridad.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------------
  # 1) SEGURIDAD: busca claves/secretos filtrados, incluso en el historial.
  # ---------------------------------------------------------------------------
  secretos:
    name: Escaneo de claves (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código (con todo el historial)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  # ---------------------------------------------------------------------------
  # 2) GUARDARRAÍLES: reglas simples del framework, revisadas con bash.
  # ---------------------------------------------------------------------------
  guardarrailes:
    name: Reglas del tablero
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nada cargado desde internet (sin CDN externo)
        run: |
          # Se excluye vendor/ (librerías de terceros vendorizadas, de confianza).
          if grep -rniE '(src|href)[[:space:]]*=[[:space:]]*["'"'"']https?://' \
               --include='*.html' --include='*.js' \
               --exclude-dir=vendor --exclude-dir=.git . ; then
            echo "::error::Hay recursos cargados desde internet. Todo debe estar en el repo (css/, js/, vendor/, assets/)."
            exit 1
          fi
          echo "OK: no se carga nada desde internet."

      - name: No hay archivos de credenciales versionados
        run: |
          if git ls-files | grep -qiE '(^|/)(\.env($|\.)|credenciales.*\.json|secretos.*\.json|.*\.pem$|.*\.key$|.*\.p12$)'; then
            echo "::error::Hay un archivo de credenciales trackeado por git. Sacalo (y cambiá esa clave: quedó en el historial)."
            exit 1
          fi
          echo "OK: no hay archivos de credenciales versionados."

      - name: No se subieron datos crudos ni planillas
        run: |
          # datos-fuente/LEEME.md es la única excepción permitida (el instructivo
          # de la carpeta; por eso sigue versionado pese al .gitignore).
          if git ls-files | grep -iE '(^datos-fuente/|\.xlsx?$)' | grep -qvi '^datos-fuente/LEEME\.md$'; then
            echo "::error::Hay datos crudos o una planilla en el repo. Solo se publica el resultado agregado en datos/."
            exit 1
          fi
          echo "OK: no hay datos crudos versionados."

      - name: El tablero usa el design system
        run: |
          miss=0
          grep -q 'css/fuentes.css' index.html || { echo "::error::index.html no enlaza css/fuentes.css (la tipografía Inter)"; miss=1; }
          grep -q 'css/tokens.css' index.html || { echo "::error::index.html no enlaza css/tokens.css"; miss=1; }
          grep -q 'css/base.css'   index.html || { echo "::error::index.html no enlaza css/base.css"; miss=1; }
          grep -q 'js/tema.js'     index.html || { echo "::error::index.html no enlaza js/tema.js (el botón de modo oscuro queda sin función)"; miss=1; }
          grep -q 'id="boton-tema"' index.html || { echo "::error::index.html no tiene el botón #boton-tema del header"; miss=1; }
          [ "$miss" = 0 ] && echo "OK: el design system está enlazado."
          exit $miss

      - name: Aviso si hay colores escritos a mano (deberían salir de tokens.css)
        run: |
          if grep -rnE '#[0-9a-fA-F]{3,6}\b' js/tablero.js 2>/dev/null; then
            echo "::warning::Hay colores escritos a mano en js/tablero.js. Los colores salen de css/tokens.css; en el tablero no deberías necesitar ninguno."
          else
            echo "OK: sin colores a mano en tablero.js."
          fi
